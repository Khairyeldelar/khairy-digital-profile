<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = "/khairy-digital-profile/";
        var pathname = window.location.pathname;
        var route = pathname.indexOf(base) === 0 ? pathname.slice(base.length - 1) : "/";
        var target = new URL(base, window.location.origin);
        target.searchParams.set("gh-pages-route", route + window.location.search + window.location.hash);
        window.location.replace(target.toString());
      })();
    </script>
  </head>
  <body></body>
</html>
